name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Build distribution bundles
        run: npm run build
        env:
          CI: true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/master'
        with:
          name: dist
          path: dist/
          retention-days: 7

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Generate documentation
        run: npm run docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/
          retention-days: 7

  demo:
    name: Build demo (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - name: Build Next.js demo
        run: npm run build:demo
        env:
          CI: true
